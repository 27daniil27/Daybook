<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <meta name="description" content="Daybook — личный дневник для ежедневных заметок, воспоминаний и трекера настроения."> <meta name="theme-color" content="#F9F9F9"> <title>Daybook — личный дневник</title> <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml"> <link rel="stylesheet" href="css/normalize.min.css"> <link rel="stylesheet" href="css/style.min.css"> </head> <body> <header class="site-header"> <a class="logo" href="#" data-screen-link="feed" aria-label="Daybook — на главную"> <img class="logo__icon" src="assets/img/logo.svg" alt="" width="32" height="32"> <span class="logo__text">Daybook</span> </a> <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav"> <span class="nav-toggle__bar"></span> <span class="nav-toggle__bar"></span> <span class="nav-toggle__bar"></span> <span class="visually-hidden">Меню</span> </button> <nav class="site-nav" id="site-nav" aria-label="Основная навигация"> <ul class="site-nav__list"> <li><a class="site-nav__link" href="#" data-screen-link="feed">Лента</a></li> <li><a class="site-nav__link" href="#" data-screen-link="new">Новая запись</a></li> <li><a class="site-nav__link" href="#" data-screen-link="auth">Вход</a></li> </ul> <button class="theme-toggle" type="button" aria-label="Переключить тему"> <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">☀️</span> <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">🌙</span> </button> </nav> </header> <main class="site-main"> <section class="screen screen--auth is-active" id="screen-auth" aria-labelledby="auth-title"> <div class="auth-card"> <img class="auth-card__logo" src="assets/img/logo.svg" alt="" width="64" height="64"> <h1 class="auth-card__title" id="auth-title">Daybook</h1> <p class="auth-card__subtitle">Введите 4-зн  btn--accent" type="submit">Сохранить</button> </div> <div class="entry-form__grid"> <div class="field"> <label class="field__label" for="entry-title">Заголовок</label> <input class="field__input" id="entry-title" name="title" type="text" placeholder="О чём этот день?" required> </div> <div class="field"> <label class="field__label" for="entry-date">Дата</label> <input class="field__input" id="entry-date" name="date" type="date" required> </div> <div class="field"> <span class="field__label" id="mood-label">Настроение</span> <div class="mood" role="radiogroup" aria-labelledby="mood-label"> <button class="mood__option" type="button" role="radio" aria-checked="false" data-mood="1" title="Ужасно">😞</button> <button class="mood__option" type="button" role="radio" aria-checked="false" data-mood="2" title="Плохо">🙁</button> <button class="mood__option" type="button" role="radio" aria-checked="true" data-mood="3" title="Нормально">😐</button> <button class="mood__option" type="button" role="radio" aria-checked="false" data-mood="4" title="Хорошо">🙂</button> <button class="mood__option" type="button" role="radio" aria-checked="false" data-mood="5" title="Отлично">😄</button> </div> </div> <div class="field"> <label class="field__label" for="entry-tags">Теги (через запятую)</label> <input class="field__input" id="entry-tags" name="tags" type="text" placeholder="спорт, работа, семья"> </div> <div class="field field--wide"> <label class="field__label" for="entry-text">Текст записи</label> <textarea class="field__input field__input--area" id="entry-text" name="text" rows="6" placeholder="Расскажите, как прошёл день…" required></textarea> </div> <div class="field field--wide"> <span class="field__label">Фотография</span> <div class="photo-upload"> <label class="btn btn--ghost photo-upload__label" for="entry-photo">📷 Прикрепить фото</label> <input class="visually-hidden" id="entry-photo" name="photo" type="file" accept="image/*"> <img class="photo-upload__preview" id="photo-preview" src="" alt="Предпросмотр фото" hidden> </div> </div> </div> <div class="entry-form__row entry-form__row--actions"> <button class="btn btn--ghost" type="button" data-screen-link="feed">Отмена</button> <button class="btn btn--accent" type="submit">Сохранить</button> </div> </form> </section> </main> <footer class="site-footer"> <p class="site-footer__text">© 2026 Daybook — личный дневник. Все данные хранятся только локально в вашем браузере.</p> </footer> <script src="js/app.min.js"></script> </body> </html>
